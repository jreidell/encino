[package]
name = "encino-agent"
description = "Session daemon holding the encino master key in locked memory."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Library only. The `encino-agent` binary is declared by `encino-cli`, which
# is what lets `cargo test` build it — see that crate's src/bin/encino-agent.rs.
[lib]
name = "encino_agent"
path = "src/lib.rs"

[dependencies]
encino-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
base64.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["mm"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
# Every feature this crate's own code needs is listed, including
# Win32_System_Console for the standard-handle work in `win.rs`. Relying on
# another crate in the workspace to enable it happens to work, because feature
# unification hands it over from rpassword, but it breaks the moment this crate
# is built or tested on its own.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
